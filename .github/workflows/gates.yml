# CI for Design Team OS. Two jobs:
#
#   structure — static checks, no API cost, runs on every push and PR:
#     * `claude plugin validate --strict` on both manifests (also parses every
#       skill's frontmatter — this is what would have caught the conductor's
#       broken YAML), and
#     * tests/check-references.sh (no SKILL.md names a skill that doesn't exist).
#
#   gates — the LLM smoke tests (tests/run.sh). These spawn real agents and cost
#     tokens, so they do NOT run on every push: trigger manually
#     (workflow_dispatch) or by adding the `run-gates` label to a PR. Requires an
#     ANTHROPIC_API_KEY repo secret. tests/run.sh is non-deterministic — if a gate
#     flakes, re-run before treating it as a real failure.

name: skill-gates

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` is not in GitHub's default PR event types — without it, adding
    # the run-gates label would never trigger the LLM job below.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Claude CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate plugin + marketplace manifests (and all skill frontmatter)
        run: |
          claude plugin validate . --strict
          claude plugin validate .claude-plugin/plugin.json --strict

      - name: Check skill cross-references resolve
        run: bash tests/check-references.sh

      - name: Check manifest version matches CHANGELOG
        run: bash tests/check-version.sh

  gates:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'run-gates')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Claude CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run skill gates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_TEST_MODEL: claude-haiku-4-5-20251001
        run: bash tests/run.sh
